apiVersion: v1
kind: Namespace
metadata:
  name: chargepoints-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chargepoints-data
  namespace: chargepoints-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargepoints-api
  namespace: chargepoints-api
  labels:
    app: chargepoints-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chargepoints-api
  template:
    metadata:
      labels:
        app: chargepoints-api
    spec:
      containers:
        - name: api
          image: localhost/chargepoints-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADDR
              value: ":8080"
            - name: DATABASE_PATH
              value: /data/chargepoints.db
            - name: OTEL_SERVICE_NAME
              value: chargepoints-api
            # Point at your cluster OTLP HTTP collector when ready, e.g.:
            # - name: OTEL_TRACES_EXPORTER
            #   value: otlp
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: otel-collector.opentelemetry-operator-system:4318
            - name: OTEL_TRACES_EXPORTER
              value: none
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chargepoints-data
---
apiVersion: v1
kind: Service
metadata:
  name: chargepoints-api
  namespace: chargepoints-api
spec:
  selector:
    app: chargepoints-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
