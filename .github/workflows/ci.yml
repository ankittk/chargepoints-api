name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/server ./cmd/server
